name: CI
on:
  push:
    branches: [main, feature/complete-platform]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nova
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nova
          AUTH_SECRET: ci-only-secret-not-for-production
          AUTH_URL: http://localhost:3000
